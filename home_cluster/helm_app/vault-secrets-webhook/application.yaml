# Перенесено из Terraform в ArgoCD без переустановки.
#
# ── Про ignoreDifferences, без них тут никак ─────────────────────────────────
# Чарт при каждом рендере выпускает новый TLS-сертификат вебхука: в шаблоне
# apiservice-webhook.yaml безусловно вызываются genCA и genSignedCert, а
# lookup, которым чарт мог бы переиспользовать уже выпущенный, там нет вовсе.
#
# Terraform и Flux этого не замечают: helm перерендеривает только когда
# меняются чарт или values. ArgoCD же сравнивает рендер с кластером
# непрерывно — и без этих правил переставлял бы сертификат каждые несколько
# минут, а приложение висело бы вечно OutOfSync.
#
# Игнорируются ровно три места, куда попадает сгенерированный материал:
#   Secret ...-webhook-tls        — сам сертификат и ключ
#   MutatingWebhookConfiguration  — caBundle, которым API-сервер проверяет вебхук
#   Deployment                    — checksum/config, это sha256 от того же
#                                   шаблона apiservice-webhook.yaml
# RespectIgnoreDifferences=true нужен, чтобы selfHeal их тоже не переписывал.
#
# Цена решения: сертификат остаётся ручным. Текущий истекает 2027-06-09.
# Альтернатива — certificate.useCertManager=true с certificate.generate=false:
# тогда цепочку выпускает cert-manager и сам её продлевает, а рендер
# становится детерминированным. Отложено осознанно.
#
# ── Прочее ──────────────────────────────────────────────────────────────────
# releaseName: bank-vault — имя релиза из Terraform, оно вшито в имена всех
# объектов. Приложение при этом названо по-человечески.
#
# ── failurePolicy пода: Fail, но только для подов со ссылками на Vault ──────
# С Ignore под, созданный в момент недоступности вебхука, стартует с
# буквальными vault:secret/data/... вместо секретов и сам из этого не выходит.
# 26.10.2026 при drain воркеров под апгрейд Talos так сломался telebot: его
# создали в ту же секунду, когда переезжала реплика вебхука.
#
# Fail для всех подов нельзя: пока вебхук лежит, не создался бы ни один под
# в кластере. Поэтому pods.matchConditions пропускает к вебхуку только поды
# с vault: в env или с аннотациями vault.security.banzaicloud.io/*. Остальные
# поды вебхук не вызывают вовсе. Поды со ссылками при недоступном вебхуке
# получают отказ, и контроллер пересоздаёт их, пока вебхук не вернётся.
#
# ВАЖНО: под, который НЕ попадает под условие, вебхук не мутирует никогда,
# даже работающий. Условие проверено 26.10.2026 на живых подах: все 16
# мутированных подов под него попадают, лишних нет. Не покрыт случай, когда
# vault:-ссылки приходят в под через envFrom/secretKeyRef/configMapKeyRef из
# ConfigMap/Secret — сейчас таких подов нет. Заведёшь такой — расширь условие.
#
# Свои поды вебхук помечает security.banzaicloud.io/mutate: skip, а
# vault-infra исключён namespaceSelector'ом — самоблокировки нет.
#
# Остальные три мутации (secrets, configmaps, objects) остаются на Ignore.
# Две реплики разнесены по нодам, плюс PDB и priorityClassName.
#
# ServiceAccount vault с правами token-review, его токен и PriorityClass лежат
# в rbac.yaml рядом: они не часть чарта, их применяет home-lab.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-secrets-webhook
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  destination:
    name: in-cluster
    namespace: vault-infra
  project: default
  ignoreDifferences:
  - kind: Secret
    name: bank-vault-vault-secrets-webhook-webhook-tls
    jsonPointers:
    - /data
  - group: admissionregistration.k8s.io
    kind: MutatingWebhookConfiguration
    name: bank-vault-vault-secrets-webhook
    jqPathExpressions:
    - .webhooks[].clientConfig.caBundle
  - group: apps
    kind: Deployment
    name: bank-vault-vault-secrets-webhook
    jsonPointers:
    - /spec/template/metadata/annotations/checksum~1config
  syncPolicy:
    # Усыновление проверено: сертификат и caBundle не изменились (sha256
    # совпали до и после), поды не перезапускались, вебхук после синхронизации
    # по-прежнему впрыскивает copy-vault-env и подменяет команду на
    # /vault/vault-env — проверено server-side dry-run'ом пода с ссылкой
    # vault:secret/data/...
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
  source:
    repoURL: ghcr.io/bank-vaults/helm-charts
    chart: vault-secrets-webhook
    targetRevision: 1.23.1
    helm:
      releaseName: bank-vault
      valuesObject:
        configMapMutation: true
        customResourceMutations:
        - servicemonitors
        env:
          ENABLE_JSON_LOG: 'true'
          RUN_AS_NON_ROOT: 'true'
          RUN_AS_USER: '1000'
          VAULT_ADDR: https://vault-cluster.local.geracorp.work
          VAULT_ADDR_ALLOWLIST: https://vault-cluster.local.geracorp.work
          VAULT_ALLOW_PRIVATE_ADDR: 'true'
          VAULT_AUTH_METHOD: kubernetes
          VAULT_PATH: talos
          VAULT_ROLE: default
          VAULT_SKIP_VERIFY: 'true'
        podDisruptionBudget:
          enabled: true
          minAvailable: 1
        podsFailurePolicy: Fail
        pods:
          matchConditions:
          - name: has-vault-refs
            expression: >-
              (has(object.metadata.annotations) &&
              object.metadata.annotations.exists(k, k.startsWith('vault.security.banzaicloud.io/')))
              || object.spec.containers.exists(c, has(c.env) &&
              c.env.exists(e, has(e.value) && e.value.contains('vault:')))
              || (has(object.spec.initContainers) &&
              object.spec.initContainers.exists(c, has(c.env) &&
              c.env.exists(e, has(e.value) && e.value.contains('vault:'))))
        priorityClassName: vault-webhook-critical
        rbac:
          authDelegatorRole:
            enabled: true
        replicaCount: 2
        secretsMutation: true
        topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: vault-secrets-webhook
              app.kubernetes.io/instance: bank-vault
