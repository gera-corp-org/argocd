apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-xray-bt-blocks
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app: kube-prometheus-stack
  annotations:
    grafana_folder: "VPN"
data:
  xray-bt-blocks.json: |-
    {
      "uid": "xray-bt-blocks",
      "title": "VPN — блокировки BitTorrent (xray)",
      "tags": ["vpn", "bittorrent", "xray"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "editable": true,
      "time": { "from": "now-24h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Заблокированные попытки BT (24 ч)",
          "description": "Соединения, срезанные правилом маршрутизации xray на входной ноде — до выхода они не доходят.",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(increase(xray_bt_block_total[24h]))",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": { "unit": "short", "noValue": "0", "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 1 } ] } },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Попытки по часам, в разрезе клиентов",
          "gridPos": { "h": 6, "w": 18, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum by (client) (increase(xray_bt_block_total[1h]))"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "custom": { "drawStyle": "bars", "fillOpacity": 40, "stacking": { "mode": "normal" }, "lineWidth": 1 } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "table", "placement": "right", "calcs": ["sum"] }, "tooltip": { "mode": "multi" } }
        },
        {
          "id": 3,
          "type": "table",
          "title": "Итоги по клиентам и адресам (за всё время)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "xray_bt_block_total",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true, "__name__": true, "job": true, "instance": true }, "renameByName": { "client": "Клиент", "ip": "IP-адрес источника", "Value": "Заблокировано" } } },
            { "id": "sortBy", "options": { "sort": [ { "field": "Заблокировано", "desc": true } ] } }
          ],
          "fieldConfig": { "defaults": {}, "overrides": [] }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Когда именно были попытки (шаг 5 мин)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum by (client, ip) (increase(xray_bt_block_total[5m]))"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "pointSize": 5, "showPoints": "auto" } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["sum"] }, "tooltip": { "mode": "multi" } }
        },
        {
          "id": 5,
          "type": "table",
          "title": "Забаненные IP (автобан)",
          "description": "Кого сейчас отрезал сторож автобана: адрес источника, профиль клиента за ним, остаток времени, точный момент снятия и владелец адреса (Team Cymru whois + reverse DNS). Клик по IP — полный внешний whois. Строки исчезают, когда бан истекает.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 14 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "xray_autoban_banned", "format": "table", "instant": true },
            { "refId": "B", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "sum without(client) (xray_autoban_remaining_seconds)", "format": "table", "instant": true },
            { "refId": "C", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "sum without(client) ((time() + xray_autoban_remaining_seconds) * 1000)", "format": "table", "instant": true },
            { "refId": "D", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "sum without(client) (xray_autoban_trigger_events)", "format": "table", "instant": true },
            { "refId": "E", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "sum without(client) (xray_autoban_whois)", "format": "table", "instant": true }
          ],
          "transformations": [
            { "id": "joinByField", "options": { "byField": "ip", "mode": "outer" } },
            { "id": "organize", "options": {
                "excludeByName": { "Time": true, "Time 1": true, "Time 2": true, "Time 3": true, "Time 4": true, "__name__": true, "job": true, "instance": true, "until": true, "Value #E": true },
                "renameByName": { "ip": "IP", "client": "Клиент", "Value #A": "Забанен", "Value #B": "Осталось, с", "Value #C": "Снимется в", "Value #D": "Событий до бана", "org": "Провайдер", "asn": "ASN", "cc": "Страна", "prefix": "Сеть", "ptr": "rDNS" },
                "indexByName": { "IP": 0, "Клиент": 1, "Забанен": 2, "Осталось, с": 3, "Снимется в": 4, "Событий до бана": 5, "Провайдер": 6, "ASN": 7, "Страна": 8, "Сеть": 9, "rDNS": 10 } } },
            { "id": "sortBy", "options": { "sort": [ { "field": "Осталось, с", "desc": false } ] } }
          ],
          "fieldConfig": {
            "defaults": { "custom": { "align": "auto", "cellOptions": { "type": "auto" }, "inspect": false } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "IP" }, "properties": [
                  { "id": "links", "value": [
                      { "title": "ipinfo.io", "url": "https://ipinfo.io/${__value.text}", "targetBlank": true },
                      { "title": "RIPE DB", "url": "https://apps.db.ripe.net/db-web-ui/query?searchtext=${__value.text}", "targetBlank": true } ] } ] },
              { "matcher": { "id": "byName", "options": "Снимется в" }, "properties": [ { "id": "unit", "value": "dateTimeAsIso" } ] },
              { "matcher": { "id": "byName", "options": "Осталось, с" }, "properties": [
                  { "id": "unit", "value": "dtdurations" },
                  { "id": "custom.cellOptions", "value": { "type": "color-text" } },
                  { "id": "thresholds", "value": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "orange", "value": 1800 }, { "color": "green", "value": 5400 } ] } } ] },
              { "matcher": { "id": "byName", "options": "Забанен" }, "properties": [ { "id": "custom.cellOptions", "value": { "type": "color-background", "mode": "basic" } }, { "id": "mappings", "value": [ { "type": "value", "options": { "0": { "text": "нет", "color": "green", "index": 0 }, "1": { "text": "ДА", "color": "red", "index": 1 } } } ] } ] }
            ]
          },
          "options": { "showHeader": true, "cellHeight": "sm", "footer": { "show": false, "reducer": ["sum"], "countRows": false, "fields": "" } }
        }
      ]
    }
