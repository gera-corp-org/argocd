apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-blackbox-exporter
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  destination:
    name: in-cluster
    namespace: monitoring
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: prometheus-blackbox-exporter
    targetRevision: 11.*
    helm:
      skipCrds: false
      valuesObject:
        config:
          modules:
            # Vault (raft nodes on :8200) returns 200 on the active node and 429 on
            # standbys, so the default http_2xx module would report two of three
            # nodes down forever. Our internal CA is not trusted by the monitoring
            # stack and cert verification is disabled by design for this cluster,
            # so skip verification here too - we only need probe_ssl_earliest_cert_expiry
            # for expiry alerting, not chain validation.
            vault_health:
              prober: http
              timeout: 5s
              http:
                valid_status_codes: [200, 429]
                preferred_ip_protocol: "ip4"
                tls_config:
                  insecure_skip_verify: true
        serviceMonitor:
          enabled: true
          targets:
            - name: biostal.ru
              url: https://biostal.ru
              hostname: biostal.ru
            - name: seafile
              url: https://sea.geracorp.org
              hostname: sea.geracorp.org
            - name: mail-biostal
              url: https://mail.biostal.ru:4040
              hostname: mail.biostal.ru
            - name: control-biostal
              url: https://control.biostal.ru:4081
              hostname: control.biostal.ru
            - name: cloud-biostal
              url: https://cloud.biostal.ru
              hostname: cloud.biostal.ru
            # Vault raft cluster TLS cert expiry (see alerts/vault-tls-cert-expiry.yaml).
            # NOTE: port 8300 does not exist on these nodes yet - it only appears
            # after the TLS-enabling image rebuild and node rotation. Do not let
            # this sync before that rotation or the probes will fail from day one.
            - name: vault-160
              url: https://192.168.1.160:8200/v1/sys/health
              module: vault_health
            - name: vault-161
              url: https://192.168.1.161:8200/v1/sys/health
              module: vault_health
            - name: vault-162
              url: https://192.168.1.162:8200/v1/sys/health
              module: vault_health
            # Продлеваемые домены (агентская линейка + свои) — контроль срока
            # TLS-сертификатов. Срок регистрации доменов — отдельный
            # domain-exporter (home_cluster/domain-exporter/).
            - name: adm-cash
              url: https://adm.cash
              hostname: adm.cash
            - name: 1win-win
              url: https://1win.win
              hostname: 1win.win
            - name: agentpanel-site
              url: https://agentpanel.site
              hostname: agentpanel.site
            - name: agentpanel-top
              url: https://agentpanel.top
              hostname: agentpanel.top
            - name: 1wagent-online
              url: https://1wagent.online
              hostname: 1wagent.online
            - name: agentcash-site
              url: https://agentcash.site
              hostname: agentcash.site
            - name: 1win-cash
              url: https://1win.cash
              hostname: 1win.cash
            - name: 1-w-cash
              url: https://1-w.cash
              hostname: 1-w.cash
            - name: 1winagent-cash
              url: https://1winagent.cash
              hostname: 1winagent.cash
            # cash-service.cc: зона делегирована на Cloudflare, но A/AAAA нет —
            # ни HTTP, ни TLS на домене не подняты. Мониторится только срок
            # регистрации (domain-exporter). Раскомментировать после появления
            # веб-сервиса на домене, иначе probe_ssl_earliest_cert_expiry будет
            # вечно отсутствовать и алерт по сертификату станет шумом.
            # - name: cash-service-cc
            #   url: https://cash-service.cc
            #   hostname: cash-service.cc
            # - name: telegram-api
            #   url: https://api.telegram.org/bot${vault:secret/data/alertmanager#telegram_token}/getMe
            #   hostname: api.telegram.org
            #   additionalMetricsRelabels:
            #   - action: replace
            #     replacement: https://api.telegram.org
            #     sourceLabels:
            #       - instance
            #     targetLabel: instance
            # - name: example                    # Human readable URL that will appear in Prometheus / AlertManager
            #   url: http://example.com/healthz  # The URL that blackbox will scrape
            #   hostname: example.com            # HTTP probes can accept an additional `hostname` parameter that will set `Host` header and TLS SNI
            #   labels: {}                       # Map of labels for ServiceMonitor. Overrides value set in `defaults`
            #   interval: 60s                    # Scraping interval. Overrides value set in `defaults`
            #   scrapeTimeout: 60s               # Scrape timeout. Overrides value set in `defaults`
            #   module: http_2xx                 # Module used for scraping. Overrides value set in `defaults`
            #   additionalMetricsRelabels: {}    # Map of metric labels and values to add
            #   additionalRelabeling: []         # List of metric relabeling actions to run
