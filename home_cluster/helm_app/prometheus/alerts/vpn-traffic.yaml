apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vpn-traffic-budget
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    app.kubernetes.io/instance: kube-prometheus-stack
spec:
  groups:
    - name: vpn-traffic-budget
      rules:
        - alert: VpnTrafficDailyLimitNear
          annotations:
            summary: >-
              homs: {{ $value | humanizePercentage }} of the daily traffic allowance used
            description: >-
              Egress on the entry node has reached {{ $value | humanizePercentage }} of the
              provider's fair-use limit for the current UTC day. When it hits 100% the channel
              is clamped to 1 Mbit/s until the next UTC midnight, which takes the whole service
              down for the rest of the day.
          expr: >-
            vpn_traffic_egress_today_bytes{node="homs"}
            / vpn_traffic_limit_bytes{node="homs"} > 0.8
          for: 5m
          labels:
            severity: warning
            service: network

        - alert: VpnTrafficDailyLimitReached
          annotations:
            summary: >-
              homs: daily traffic allowance exhausted, channel will be throttled to 1 Mbit
            description: >-
              Egress since 00:00 UTC reached the provider limit
              ({{ $value | humanize }} bytes over the allowance). Expect the outgoing channel to
              be clamped to 1 Mbit/s until 00:00 UTC: clients keep their sessions but throughput
              collapses. The allowance resets at UTC midnight, which in practice lands in the
              early morning rather than at 00:00 sharp.
          expr: >-
            vpn_traffic_egress_today_bytes{node="homs"}
            - vpn_traffic_limit_bytes{node="homs"} >= 0
          for: 2m
          labels:
            severity: warning
            service: network

        - alert: VpnEgressThrottled
          annotations:
            summary: >-
              homs: egress pinned at ~1 Mbit with {{ $value | humanize }} established sessions
            description: >-
              The entry node keeps its sessions but moves almost no data while the daily traffic
              allowance is already spent. That is the provider's throttle, not idle users:
              expect 1 Mbit/s until the allowance resets.
          expr: >-
            node_netstat_Tcp_CurrEstab{instance="homs.geracorp.org:8844"} > 40
            and on() (
              sum(rate(node_network_transmit_bytes_total{instance="homs.geracorp.org:8844",device="eth0"}[10m])) < 160000
            )
            and on() (
              vpn_traffic_egress_today_bytes{node="homs"} >= 0.95 * vpn_traffic_limit_bytes{node="homs"}
            )
          for: 15m
          labels:
            severity: critical
            service: network
