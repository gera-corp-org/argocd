# Внешние smartctl_exporter на нодах Proxmox — Service без селектора,
# статические Endpoints и ServiceMonitor (ноды вне кластера).
apiVersion: v1
kind: Service
metadata:
  name: pve-smartctl
  namespace: monitoring
  labels:
    app: pve-smartctl
spec:
  clusterIP: None
  ports:
  - name: metrics
    port: 9633
    targetPort: 9633
---
apiVersion: v1
kind: Endpoints
metadata:
  name: pve-smartctl
  namespace: monitoring
  labels:
    app: pve-smartctl
subsets:
- addresses:
  - ip: 192.168.1.2
  - ip: 192.168.1.3
  - ip: 192.168.1.4
  # рабочий ПК (Windows 11); доступен из кластера только через туннельный адрес
  - ip: 10.0.0.11
  ports:
  - name: metrics
    port: 9633
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pve-smartctl
  namespace: monitoring
  labels:
    app: pve-smartctl
spec:
  selector:
    matchLabels:
      app: pve-smartctl
  endpoints:
  - port: metrics
    interval: 60s
    scrapeTimeout: 30s
    relabelings:
    - sourceLabels:
      - __address__
      regex: 192\.168\.1\.2:.*
      targetLabel: node
      replacement: proxmox-01
    - sourceLabels:
      - __address__
      regex: 192\.168\.1\.3:.*
      targetLabel: node
      replacement: proxmox-02
    - sourceLabels:
      - __address__
      regex: 192\.168\.1\.4:.*
      targetLabel: node
      replacement: proxmox-03
    - sourceLabels:
      - __address__
      regex: 10\.0\.0\.11:.*
      targetLabel: node
      replacement: gera-pc
