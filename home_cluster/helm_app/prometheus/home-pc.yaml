apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: home-pc
  namespace: monitoring
  labels:
    prometheus: home-pc
    release: prom
spec:
  scheme: HTTP
  metricsPath: /metrics
  staticConfigs:
    - labels:
        job: home-pc
      targets:
        # OhmGraphite on the desktop. 192.168.100.53 was its old LAN address and has
        # been dead for weeks while the exporter kept answering on 10.0.0.11, so the
        # stale entry only produced a permanent TargetDown.
        - 10.0.0.11:4445
  relabelings:
    - sourceLabels: [__address__]
      regex: ([^:]+)(?::\d+)?
      targetLabel: ip_address
      replacement: $1
      action: replace
