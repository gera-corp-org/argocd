apiVersion: v1
kind: Service
metadata:
  name: domain-exporter
  namespace: monitoring
  labels:
    app: domain-exporter
spec:
  clusterIP: None
  selector:
    app: domain-exporter
  ports:
    - name: metrics
      port: 9222
      targetPort: metrics
    - name: ru-metrics
      port: 9223
      targetPort: ru-metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: domain-exporter
  namespace: monitoring
  labels:
    app: domain-exporter
spec:
  selector:
    matchLabels:
      app: domain-exporter
  namespaceSelector:
    matchNames:
      - monitoring
  # Интервал < default lookback-delta Prometheus (5m), иначе инстант-запросы
  # между скрейпами не видят метрику и алерты флапают. Реальные WHOIS-запросы
  # редки: caarlos0 кэширует на 6h, сайдкар обновляется раз в 6h.
  endpoints:
    - port: metrics
      path: /metrics
      interval: 2m
      scrapeTimeout: 60s
    - port: ru-metrics
      path: /metrics
      interval: 2m
      scrapeTimeout: 60s
